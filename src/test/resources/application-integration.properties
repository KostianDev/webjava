# Integration test configuration
# Database connection will be provided by TestContainers via @DynamicPropertySource

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Feature toggles
feature.cosmoCats.enabled=true
feature.kittyProducts.enabled=false

# API config
api.prefix=/api/v4
supplier.base-url=http://localhost:8089

# Security - disable for integration tests (use @WithMockUser instead)
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
security.api-key.enabled=false
