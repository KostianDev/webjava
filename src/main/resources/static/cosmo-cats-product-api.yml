openapi: 3.0.3
info:
  title: Cosmo Cats Product API
  version: 4.0.0
  description: API contract for Product CRUD operations for Cosmo Cats Intergalactic Marketplace
servers:
  - url: /api/v4
paths:
  /products:
    get:
      summary: List products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDTO'
    post:
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Validation error
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get product by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Not found
    put:
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      summary: Delete a product
      responses:
        '204':
          description: Deleted
components:
  schemas:
    ProductDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          description: Must contain a cosmic term like 'star', 'galaxy', or 'comet'
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0.01
        category:
          type: string
          minLength: 1
      required:
        - name
        - price
        - category
