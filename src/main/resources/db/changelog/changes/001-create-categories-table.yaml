databaseChangeLog:
  - changeSet:
      id: 001-create-categories-table
      author: kostia
      changes:
        - createSequence:
            sequenceName: categories_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: categories_id_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
        - createIndex:
            indexName: idx_categories_name
            tableName: categories
            columns:
              - column:
                  name: name
        - addUniqueConstraint:
            tableName: categories
            columnNames: name
            constraintName: uq_categories_name
