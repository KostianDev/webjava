databaseChangeLog:
  - changeSet:
      id: 004-create-orders-table
      author: kostia
      changes:
        - createSequence:
            sequenceName: orders_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: orders_id_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_user
        - addUniqueConstraint:
            tableName: orders
            columnNames: order_number
            constraintName: uq_orders_order_number
        - createIndex:
            indexName: idx_orders_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_orders_order_number
            tableName: orders
            columns:
              - column:
                  name: order_number
