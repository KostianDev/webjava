databaseChangeLog:
  - changeSet:
      id: 002-create-products-table
      author: kostia
      changes:
        - createSequence:
            sequenceName: products_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: products_id_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category
        - createIndex:
            indexName: idx_products_name
            tableName: products
            columns:
              - column:
                  name: name
        - createIndex:
            indexName: idx_products_category_id
            tableName: products
            columns:
              - column:
                  name: category_id
        - addUniqueConstraint:
            tableName: products
            columnNames: name, category_id
            constraintName: uq_products_name_category
